name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Fixed Keystore Signature
        run: |
          if [ -f "android/app/debug.keystore.base64" ]; then
            echo "Restoring fixed keystore from base64..."
            base64 -d android/app/debug.keystore.base64 > android/app/debug.keystore
          else
            echo "Generating initial fixed keystore..."
            keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BachNganCons,O=KidsEdtech,C=VN"
          fi

      - name: Auto Increment Version Code & Name
        run: |
          sed -i 's/versionCode [0-9]*/versionCode '${{ github.run_number }}'/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.'${{ github.run_number }}'"/g' android/app/build.gradle

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BachNganCons-Kids-English-Android-v1.0.${{ github.run_number }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
